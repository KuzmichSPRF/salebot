name: Deploy Bot

on:
  push:
    branches:
      - main # Укажите master, если ваша основная ветка называется master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # Обычно 22
          script: |
            # Переходим в директорию с проектом на сервере для пользователя botuser
            cd /home/botuser/salebot
            
            # Подтягиваем свежие изменения
            git pull origin main
            
            # Опционально: установка новых зависимостей
            # source venv/bin/activate
            # pip install -r requirements.txt
            
            # Перезапускаем сервис бота
            sudo systemctl restart salebot.service